# ----- Hero (top banner on the home page) -----
# Photo shows ONLY if this file exists in the repo; otherwise the banner has no photo.
# To show your portrait, either drop a file at the path below, or point it at an
# existing image e.g. "/assets/img/profile_image_2022.jpg".
hero_image: "/assets/img/hero.jpg"
name_ko: "박정민"
hero_role: "M.S. Student &middot; <a href='https://silab.kaist.ac.kr/'>SILAB</a>, KAIST"
hero_tagline: "Flow Map Alignment &amp; Multi-agentic Systems"
# Short 1-2 sentence intro shown inside the hero card. Keep it complementary to
# the role + tagline above it (don't repeat the affiliation or research topics).
hero_intro: "I enjoy turning new AI research into tools that solve real problems, and sharing what I learn along the way. Always open to research collaborations, discussions, or a casual chat."

# NOTE: the About Me section was removed from the home page (the hero card intro
# replaces it), so `about_me` below is currently UNUSED. Kept here in case you
# want to restore the section later.
about_me: |-
  <span class='about-quote'>Optimism is the faith that leads to achievement.</span>

  I am <strong>Jeongmin Park, an M.S. student at <a href='https://silab.kaist.ac.kr/'>SILAB KAIST</a></strong>. My research interests include multi-modal AI and generative model alignment. I am passionate about exploring the latest advancements in AI and applying them to solve real-world problems. In my free time, I enjoy reading research papers, coding, and sharing my knowledge through this blog.

  I am also open to collaborations, discussions on AI research or even casual conversations. So feel free to reach out to me via email or social media!

publication_note: >-
  Publication notes are short posts where I explain each paper in plain language,
  including motivation, key idea, and takeaways.

